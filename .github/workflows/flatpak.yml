name: Flatpak

# Builds a .flatpak bundle on every tag push, and points the Flathub manifest at the tag's sources.
#
# Required secrets / variables for Flathub publishing:
#   vars.FLATHUB_MANIFEST_REPO  — e.g. "zeuros/io.github.zeuros.gitgud"
#   secrets.FLATHUB_REPO_TOKEN  — fine-grained PAT with Contents+PR write access

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build Flatpak for (e.g. v2.4.0)'
        required: true

permissions:
  contents: write

env:
  APP_ID: io.github.zeuros.gitgud
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Extract version
        id: meta
        run: |
          TAG=${{ github.ref_name || inputs.tag }}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build frontend
        run: npm run build:angular

      # custom-protocol serves the built frontend, as `tauri build` does; without it the app loads the dev server URL
      - name: Build Tauri binary
        run: cargo build --release --features tauri/custom-protocol
        working-directory: src-tauri

      - name: Stage the binary and icons
        run: |
          mkdir -p release staging/bin staging/icons
          cp src-tauri/target/release/gitgud staging/bin/gitgud
          cp src-tauri/icons/32x32.png       staging/icons/32x32.png
          cp src-tauri/icons/64x64.png       staging/icons/64x64.png
          cp src-tauri/icons/128x128.png     staging/icons/128x128.png
          cp src-tauri/icons/128x128@2x.png  staging/icons/256x256.png
          cp src-tauri/icons/icon.png        staging/icons/512x512.png

      # ── Flatpak bundle via flatpak-builder ─────────────────────────────────
      - name: Cache Flatpak SDK
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-sdk-gnome-51-x64

      - name: Install Flatpak build tools
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y \
            org.gnome.Platform//51 \
            org.gnome.Sdk//51

      - name: Write CI manifest (uses local staging dir, no remote download)
        run: |
          cat > /tmp/ci-manifest.yml << 'MANIFEST'
          app-id: io.github.zeuros.gitgud
          runtime: org.gnome.Platform
          runtime-version: "51"
          sdk: org.gnome.Sdk
          command: gitgud
          separate-locales: false
          finish-args:
            - --share=ipc
            - --socket=fallback-x11
            - --socket=wayland
            - --share=network
            - --device=dri
            - --filesystem=home
            - --socket=ssh-auth
          modules:
            - name: gitgud
              buildsystem: simple
              build-commands:
                - install -Dm755 bin/gitgud /app/bin/gitgud
                - install -Dm644 io.github.zeuros.gitgud.desktop
                    /app/share/applications/io.github.zeuros.gitgud.desktop
                - install -Dm644 io.github.zeuros.gitgud.metainfo.xml
                    /app/share/metainfo/io.github.zeuros.gitgud.metainfo.xml
                - install -Dm644 icons/32x32.png
                    /app/share/icons/hicolor/32x32/apps/io.github.zeuros.gitgud.png
                - install -Dm644 icons/64x64.png
                    /app/share/icons/hicolor/64x64/apps/io.github.zeuros.gitgud.png
                - install -Dm644 icons/128x128.png
                    /app/share/icons/hicolor/128x128/apps/io.github.zeuros.gitgud.png
                - install -Dm644 icons/256x256.png
                    /app/share/icons/hicolor/256x256/apps/io.github.zeuros.gitgud.png
                - install -Dm644 icons/512x512.png
                    /app/share/icons/hicolor/512x512/apps/io.github.zeuros.gitgud.png
              sources:
                - type: dir
                  path: STAGING_DIR
                - type: file
                  path: DESKTOP_FILE
                - type: file
                  path: METAINFO_FILE
          MANIFEST

          sed -i \
            -e "s|STAGING_DIR|$GITHUB_WORKSPACE/staging|" \
            -e "s|DESKTOP_FILE|$GITHUB_WORKSPACE/build/flatpak/io.github.zeuros.gitgud.desktop|" \
            -e "s|METAINFO_FILE|$GITHUB_WORKSPACE/build/flatpak/io.github.zeuros.gitgud.metainfo.xml|" \
            /tmp/ci-manifest.yml

      - name: Build Flatpak
        run: |
          flatpak-builder --user \
            --install-deps-from=flathub \
            --force-clean \
            --repo=/tmp/flatpak-repo \
            /tmp/flatpak-build \
            /tmp/ci-manifest.yml

      - name: Bundle Flatpak
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          flatpak build-bundle /tmp/flatpak-repo \
            "release/GitGud-${VERSION}-Linux-x64.flatpak" \
            io.github.zeuros.gitgud

      # ── Upload to GitHub release ───────────────────────────────────────────
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          # release.yml creates the release only after its (slower) Tauri build — make sure it exists first
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --verify-tag --title "${{ github.ref_name }}" \
            || gh release view "${{ github.ref_name }}" >/dev/null
          gh release upload "${{ github.ref_name }}" \
            "release/GitGud-${VERSION}-Linux-x64.flatpak" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: release/GitGud-*-Linux-x64.flatpak
          retention-days: 7

  # ── Point the manifest repo at the tag's sources (open the PR to Flathub by hand) ──
  update-flathub:
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      vars.FLATHUB_MANIFEST_REPO != ''

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Checkout Flathub manifest repo
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.FLATHUB_MANIFEST_REPO }}
          token: ${{ secrets.FLATHUB_REPO_TOKEN }}
          path: flathub-manifest

      # GitHub's source archive of the tag, which the manifest builds from
      - name: Update the source archive
        run: |
          VERSION=${{ needs.build.outputs.version }}
          URL="https://github.com/zeuros/gitgud/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          python3 scripts/update-flatpak-manifest.py --url "$URL" --sha256 "$SHA" \
            --manifest "flathub-manifest/${{ env.APP_ID }}.yml"

      # The dependencies the offline build installs, from the tag's lockfiles
      - name: Regenerate the cargo and npm sources
        run: |
          pip install "git+https://github.com/flatpak/flatpak-builder-tools.git@${FLATPAK_BUILDER_TOOLS}#subdirectory=node" aiohttp tomlkit PyYAML
          curl -fsSL -o flatpak-cargo-generator.py \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${FLATPAK_BUILDER_TOOLS}/cargo/flatpak-cargo-generator.py"
          python3 flatpak-cargo-generator.py src-tauri/Cargo.lock -o flathub-manifest/cargo-sources.json
          flatpak-node-generator npm package-lock.json -o flathub-manifest/node-sources.json
        env:
          FLATPAK_BUILDER_TOOLS: 9d86d336a39b9af38b86f114b6ce5820fe260f91

      - name: Commit and push to manifest repo
        run: |
          git -C flathub-manifest config user.name  "github-actions[bot]"
          git -C flathub-manifest config user.email "github-actions[bot]@users.noreply.github.com"
          git -C flathub-manifest add "${{ env.APP_ID }}.yml" cargo-sources.json node-sources.json
          git -C flathub-manifest commit -m "Update to v${{ needs.build.outputs.version }}"
          git -C flathub-manifest push
