name: Flatpak

# On every tag push: points the Flathub manifest at the tag's sources, then builds that manifest into the .flatpak
# bundle of the release, as Flathub would build it.
#
# Required secrets / variables:
#   vars.FLATHUB_MANIFEST_REPO  — e.g. "zeuros/io.github.zeuros.gitgud"
#   secrets.FLATHUB_REPO_TOKEN  — fine-grained PAT with Contents+PR write access

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build Flatpak for (e.g. v2.4.0)'
        required: true

permissions:
  contents: write

env:
  APP_ID: io.github.zeuros.gitgud
  TAG: ${{ inputs.tag || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: 'true'

jobs:
  # ── Point the manifest repo at the tag's sources (open the PR to Flathub by hand) ──
  update-flathub:
    runs-on: ubuntu-latest
    if: vars.FLATHUB_MANIFEST_REPO != ''

    outputs:
      manifest-commit: ${{ steps.push.outputs.commit }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Checkout Flathub manifest repo
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.FLATHUB_MANIFEST_REPO }}
          token: ${{ secrets.FLATHUB_REPO_TOKEN }}
          path: flathub-manifest

      # GitHub's source archive of the tag, which the manifest builds from
      - name: Update the source archive
        run: |
          URL="https://github.com/zeuros/gitgud/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          python3 scripts/update-flatpak-manifest.py --url "$URL" --sha256 "$SHA" \
            --manifest "flathub-manifest/${{ env.APP_ID }}.yml"

      # The dependencies the offline build installs, from the tag's lockfiles
      - name: Regenerate the cargo and npm sources
        run: |
          pip install "git+https://github.com/flatpak/flatpak-builder-tools.git@${FLATPAK_BUILDER_TOOLS}#subdirectory=node" aiohttp tomlkit PyYAML
          curl -fsSL -o flatpak-cargo-generator.py \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${FLATPAK_BUILDER_TOOLS}/cargo/flatpak-cargo-generator.py"
          python3 flatpak-cargo-generator.py src-tauri/Cargo.lock -o flathub-manifest/cargo-sources.json
          flatpak-node-generator npm package-lock.json -o flathub-manifest/node-sources.json
        env:
          FLATPAK_BUILDER_TOOLS: 9d86d336a39b9af38b86f114b6ce5820fe260f91

      # A manual run on a tag already published finds nothing to commit
      - name: Commit and push to manifest repo
        id: push
        run: |
          cd flathub-manifest
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.APP_ID }}.yml" cargo-sources.json node-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Update to ${TAG#v}"
            git push
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Build the manifest into the release's .flatpak bundle ─────────────────────
  # Flathub's image comes with the GNOME SDK installed; flatpak-builder needs the privileges for its FUSE mounts.
  bundle:
    runs-on: ubuntu-latest
    needs: [update-flathub]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Checkout Flathub manifest repo
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.FLATHUB_MANIFEST_REPO }}
          token: ${{ secrets.FLATHUB_REPO_TOKEN }}
          ref: ${{ needs.update-flathub.outputs.manifest-commit }}

      - name: Set the bundle name
        run: echo "BUNDLE=GitGud-${TAG#v}-Linux-x64.flatpak" >> "$GITHUB_ENV"

      # Builds into the bundle and uploads it as the artifact named after it
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: ${{ env.APP_ID }}.yml
          bundle: ${{ env.BUNDLE }}
          artifact-name: flatpak-bundle
          mirror-screenshots-url: https://dl.flathub.org/media

  # ── Attach the bundle to the release (the build image has no gh) ──────────────
  release:
    runs-on: ubuntu-latest
    needs: [bundle]

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-bundle

      - name: Upload to release
        run: |
          # release.yml creates the release only after its (slower) Tauri build — make sure it exists first
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "GitGud-${TAG#v}-Linux-x64.flatpak" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
