[package]
name = "gitgud"
version = "2.15.0"
edition = "2021"

[lib]
name = "gitgud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
md5 = "0.8"
notify = "8"
tokio = { version = "1", features = ["full"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-prevent-default = "6"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
ignore = "0.4.34"
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.7.1", default-features = false, features = ["tokio", "native_crypto"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
