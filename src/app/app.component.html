<router-outlet/>
@if (fixup.selectingFixupTarget()) {
  <div class="fixup-overlay-mask"></div>
}

<gitgud-lord-reflog/>

<p-toast position="bottom-center" (click)="dismissToastOnClick($event)"/>
<p-toast [key]="ACTION_TOAST_KEY" position="bottom-center">
  <ng-template #message let-message>
    <div class="flex align-items-center gap-3 flex-1">
      <span class="flex-1">{{ message.detail }}</span>
      <button pButton size="small" (click)="runToastAction(message.data)">{{ message.data.label }}</button>
    </div>
  </ng-template>
</p-toast>
<p-confirm-dialog [style]="{width: '32rem', minWidth: '24rem', maxWidth: '60vw'}"/>
<p-context-menu #globalMenu [model]="activeContextMenu.contextMenu()" appendTo="body"/>

<p-dialog header="Git not found" [visible]="!gitApi.gitFound()" [modal]="true" [closable]="false" [style]="{width: '28rem'}">
  <p>Git is not installed or not in PATH.</p>
  <p>Install command:</p>
  <code>{{ installInfo.cmd }}</code>
  <p style="margin-top: 1rem">Then restart GitGud.</p>
  <ng-template #footer>
    <button pButton severity="secondary" (click)="browseForGit()">Browse for git...</button>
    <button pButton (click)="openDownloadPage()">Open download page</button>
  </ng-template>
</p-dialog>
