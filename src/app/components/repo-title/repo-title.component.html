<!-- An animated image can't be paused: show its still first frame, and the animation on hover / while refreshing -->
<img class="bonfire" alt=""
     [class.playing]="bonfirePlaying()"
     [src]="bonfirePlaying() ? './assets/images/bonfire.webp' : './assets/images/bonfire-still.png'"
     [pTooltip]="'GitGud v' + appVersion" tooltipPosition="bottom"
     (mouseenter)="bonfireHovered.set(true)"
     (mouseleave)="bonfireHovered.set(false)">
<div class="repo-name-clip">
    <div class="repo-info-track">
        <span class="repo-name">
            {{ currentRepo.name() }}
        </span>
    </div>
</div>
