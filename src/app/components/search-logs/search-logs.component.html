<div class="pink-blur"></div>
<div class="search-box">
    <input #searchInput autofocus type="text" name="search" placeholder="Search.." (input)="searchChange.emit($any($event.target).value)" (keydown)="onKeydown($event)"> <i class="fa fa-search mr-2"></i>
</div>
<div class="match-nav">
    <span class="match-count">{{ matchCount() ? currentMatch() + 1 : 0 }}/{{ matchCount() }}</span>
    <button type="button" title="Previous match (Shift+Enter)" [disabled]="!matchCount()" (click)="previous.emit()"><i class="fa fa-chevron-up"></i></button>
    <button type="button" title="Next match (Enter)" [disabled]="!matchCount()" (click)="next.emit()"><i class="fa fa-chevron-down"></i></button>
</div>
