<div class="clone-form">
    <p-float-label>
        <input
                id="clone-url"
                type="text"
                pInputText
                [ngModel]="url()"
                (ngModelChange)="onUrlChange($event)"
                style="width: 100%"
        />
        <label for="clone-url">Repository URL</label>
    </p-float-label>

    <div class="dir-row">
        <p-float-label style="flex: 1">
            <input
                    id="clone-dir"
                    type="text"
                    pInputText
                    [ngModel]="targetDir()"
                    (ngModelChange)="targetDir.set($event)"
                    style="width: 100%"
            />
            <label for="clone-dir">Target directory</label>
        </p-float-label>
        <button pButton text pTooltip="Browse" (click)="pickDirectory()" iconOnly><i class="fa fa-folder-open"></i></button>
    </div>

    <p-float-label>
        <input
                id="clone-name"
                type="text"
                pInputText
                [ngModel]="repoName()"
                (ngModelChange)="repoName.set($event)"
                style="width: 100%"
        />
        <label for="clone-name">Repository name</label>
    </p-float-label>

    @if (targetDir() && repoName()) {
        <span class="clone-path" [class.exists]="repoExists()">
            <span class="arrow">→</span> {{ repoPath() }}
            @if (repoExists()) { <i class="fa fa-check-circle"></i> already exists }
        </span>
    }
</div>

<div class="clone-actions">
    <button pButton text (click)="ref.close()">Cancel</button>
    @if (repoExists()) {
        <button pButton
                (click)="openExisting()"
                [disabled]="!targetDir().length || !repoName().length || loading()"
        ><i [class]="loading() ? 'pi pi-spin pi-spinner' : 'fa fa-folder-open'"></i>Open</button>
    } @else {
        <button pButton
                (click)="clone()"
                [disabled]="!url().length || !targetDir().length || !repoName().length || loading()"
        ><i [class]="loading() ? 'pi pi-spin pi-spinner' : 'fa fa-download'"></i>Clone</button>
    }
</div>
