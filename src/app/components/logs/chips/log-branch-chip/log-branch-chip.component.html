@if (localBranch()?.isHeadPointed) {
    <i class="fa fa-check mr-2 with-padding"></i>
}
<span class="ellipsis branch-name">{{ normalizedBranchName(localBranch() ?? remoteBranch() ?? null) }}</span>
<span class="float-icons">
    @if (otherWorktreeTooltip(); as title) {
        <i class="fa fa-tree" [title]="title"></i>
    }
    @if (localBranch()) {
        <i class="fa fa-laptop"></i>
    }
    @if (remoteBranch(); as remoteBranch) {
        <i class="fa fa-github" [title]="remoteBranch.name"></i>
    }
</span>
