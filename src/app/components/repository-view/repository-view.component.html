@if (currentRepo.cwd(); as repoId) {
    <p-splitter stateStorage="local" [stateKey]="'splitter-main-view-' + repoId" class="h-full">
        <p-splitter-panel [size]="14" [minSize]="8">
            <gitgud-left-panel/>
        </p-splitter-panel>
        <p-splitter-panel [size]="67" [minSize]="13">
            <gitgud-logs/>
        </p-splitter-panel>
        <p-splitter-panel [size]="19" [minSize]="10">
            <gitgud-commit-section #commitPanel/>
        </p-splitter-panel>
    </p-splitter>

    @let file = fileDiffPanel.fileToDiff$ | async;
    <!-- Editors (Monaco, merge editor + shiki) are loaded on first use: they're most of the app's code -->
    @defer (when file) {
        <gitgud-monaco-editor-view
                [fileToDiff]="file"
                class="editor-overlay"
                [style.right.px]="editorRightPx()"
                [style.display]="file ? '' : 'none'"/>
    }
    @if (fileDiffPanel.conflictedFile()) {
        @defer (on immediate) {
            <gitgud-merge-editor class="editor-overlay" [style.right.px]="editorRightPx()"/>
        }
    }
}
