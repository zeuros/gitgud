@let selectedCommit = currentRepo.selectedCommit();
@let selectedStash = currentRepo.selectedStash();

@if (selectedStash) {
    <h4 class="m-0">Stash:
        <button pButton
                class="p-0"
                [link]="true"
                size="small"
                (click)="copyToClipboard(selectedStash.parentSHAs[1])"
                (mouseout)="copyTooltip.set('Copy')"
                [pTooltip]="copyTooltip()"
                tooltipPosition="top"
        >{{ short(selectedStash.parentSHAs[1]) }}</button>
    </h4>

    <p-divider class="mb-0"/>

    <gitgud-identity-card [commit]="selectedStash" [showParent]="true"/>

    <gitgud-commit-file-list class="pt-2" [files]="(editedFiles()?.files ?? [])"/>

} @else if (selectedCommit) {
    <h4 class="m-0">Commit:
        <button pButton
                class="p-0"
                [link]="true"
                size="small"
                (click)="copyToClipboard(selectedCommit.sha)"
                (mouseout)="copyTooltip.set('Copy')"
                [pTooltip]="copyTooltip()"
                tooltipPosition="top"
        >{{ selectedCommit.shortSha }}</button>
    </h4>

    <p-divider class="mb-0"/>

    <div class="flex flex-column items-center justify-center">
        <div class="py-2">
            Amend commit message
        </div>
        <form #amendCommitForm class="flex flex-column flex-1" [formGroup]="editCommitForm" (ngSubmit)="rewordCommit()" (keydown.control.enter)="commitFormValueChanged() && rewordCommit()">

            <input pInputText placeholder="Summary" class="w-full commit-summary" formControlName="summary"/>

            <textarea pTextarea placeholder="Description" rows="6" class="flex-1 commit-description" formControlName="description"></textarea>

            <button pButton
                    type="submit"
                    class="flex gap-2 mt-2 w-full border-round-xs"
                    [disabled]="!commitFormValueChanged() || rewording()"
            >
                @if (rewording()) {
                    <i class="pi pi-spin pi-spinner"></i>
                }
                Update message
                @if (reworded()) {
                    <i class="pi pi-check reworded-check" (animationend)="reworded.set(false)"></i>
                }
            </button>

        </form>
    </div>

    <p-divider/>

    <gitgud-identity-card [commit]="selectedCommit"/>

    <gitgud-commit-file-list class="pt-2" [files]="(editedFiles()?.files ?? [])"/>

}
