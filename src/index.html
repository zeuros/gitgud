<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitGud</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply the saved theme classes before first paint so the page uses the app's --background from the start (mirrors ThemeService)
    (function () {
      // See-through until main.ts reveals the window, once it got its size and the layout settled
      document.documentElement.classList.add('starting');
      var mode = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (mode === 'light') return;
      document.documentElement.classList.add('dark');
      if (mode !== 'dark') document.documentElement.classList.add(mode);
    })();
  </script>
</head>
<body>
  <gitgud-root></gitgud-root>
</body>
</html>
